<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html {
        color-scheme: light dark;
      }
      body {
        font-family: "Roboto Mono", monospace;
      }
      .cursor-blink {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="min-h-dvh bg-white dark:bg-neutral-950 p-6 md:p-12">
    <div id="terminal" class="isolate text-base"></div>
    <script>
      const typingSpeeds = {
        fast: 15,
        commandMedium: 30,
        commandSlow: 50,
        commandFast: 25,
        final: 35,
      };

      const commands = [
        {
          text: "git remote set-url origin https://milindmishra.com",
          isCommand: true,
          speedProfile: "mixed",
          urlPause: 250,
        },
        {
          text: "git push origin main --force",
          isCommand: true,
          speedProfile: "commandFast",
        },
        {
          text: "Enumerating objects: done...",
          isCommand: false,
          speedProfile: "fast",
        },
        {
          text: "Counting objects: 100%",
          isCommand: false,
          speedProfile: "fast",
        },
        {
          text: "Delta compression: up to date",
          isCommand: false,
          speedProfile: "fast",
        },
        {
          text: "Writing objects: 100%",
          isCommand: false,
          speedProfile: "fast",
        },
        {
          text: "Redirecting to main repository...",
          isCommand: false,
          speedProfile: "final",
        },
      ];

      const lineDelays = [600, 400, 100, 100, 100, 200];

      const terminal = document.getElementById("terminal");

      function createLine(text, isCommand) {
        const line = document.createElement("div");
        line.className = "mb-1";

        if (isCommand) {
          const prompt = document.createElement("span");
          prompt.className = "text-neutral-500 dark:text-neutral-400";
          prompt.textContent = "$ ";
          line.appendChild(prompt);

          const commandText = document.createElement("span");
          commandText.className = "text-neutral-900 dark:text-neutral-50";
          line.appendChild(commandText);
          return { line, textElement: commandText };
        } else {
          const output = document.createElement("span");
          output.className = "text-neutral-600 dark:text-neutral-400";
          line.appendChild(output);
          return { line, textElement: output };
        }
      }

      function addCursor(line) {
        const cursor = document.createElement("span");
          cursor.className = "text-neutral-900 dark:text-neutral-50 cursor-blink";
        cursor.textContent = "|";
        cursor.id = "active-cursor";
        line.appendChild(cursor);
      }

      function removeCursor() {
        const cursor = document.getElementById("active-cursor");
        if (cursor) {
          cursor.remove();
        }
      }

      function getCharSpeed(char, index, speedProfile, urlPause, charsTyped) {
        if (speedProfile === "mixed") {
          if (charsTyped < 25) return typingSpeeds.commandMedium;
          if (charsTyped === 25) return urlPause;
          return typingSpeeds.commandSlow;
        }
        return typingSpeeds[speedProfile];
      }

      function typeText(element, text, speedProfile, urlPause = 0) {
        return new Promise((resolve) => {
          let index = 0;
          let charsTyped = 0;
          function typeChar() {
            if (index < text.length) {
              element.textContent += text[index];
              let delay = getCharSpeed(
                text[index],
                index,
                speedProfile,
                urlPause,
                charsTyped,
              );
              index++;
              charsTyped++;
              setTimeout(typeChar, delay);
            } else {
              resolve();
            }
          }
          typeChar();
        });
      }

      async function typeAllCommands() {
        const commandLines = commands.filter((cmd) => cmd.isCommand);
        const outputLines = commands.filter((cmd) => !cmd.isCommand);

        for (let i = 0; i < commandLines.length; i++) {
          const cmd = commandLines[i];
          const { line, textElement } = createLine(cmd.text, cmd.isCommand);
          terminal.appendChild(line);
          addCursor(line);

          await typeText(
            textElement,
            cmd.text,
            cmd.speedProfile,
            cmd.urlPause || 0,
          );
          removeCursor();

          if (i < commandLines.length - 1) {
            await new Promise((resolve) => setTimeout(resolve, lineDelays[i]));
          }
        }

        await new Promise((resolve) => setTimeout(resolve, 800));

        for (const cmd of outputLines) {
          const { line, textElement } = createLine(cmd.text, cmd.isCommand);
          terminal.appendChild(line);
          textElement.textContent = cmd.text;
        }

        await new Promise((resolve) => setTimeout(resolve, 1500));
        window.location.href = "https://milindmishra.com";
      }

      typeAllCommands();
    </script>
  </body>
</html>
